wrapper_args:
  c1: 64
  c2: 8
  centred: true
  eps: 665.35791015625
  hierarchical: true
  in_channels: 2
  kappa_floor: 8.0
  kappa_hi: 255.0
  kappa_lo: 10.0
  lam_rbr: 1.0
  lam_sd: 0.1
  masked: true
  num_entity: 6
  num_frame: 10
  num_point: 17
  sd_pairs: 4
  sd_points: 8
